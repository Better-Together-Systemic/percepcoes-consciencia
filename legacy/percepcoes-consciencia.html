function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k,v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'className') el.className = v;
      else if (k === 'disabled') { if(v) el.disabled = true; }
      else if (k === 'placeholder') el.placeholder = v;
      else if (k === 'type') el.type = v;
      else if (k === 'value' && (tag==='input'||tag==='textarea')) { el.value = v; }
      else if (k === 'href') el.href = v;
      else if (k === 'target') el.target = v;
      else if (k === 'rel') el.rel = v;
      else el.setAttribute(k, v);
    }
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    if (typeof child === 'string' || typeof child === 'number') el.appendChild(document.createTextNode(child));
    else el.appendChild(child);
  }
  return el;
}

// ─── API CALL ─────────────────────────────────────────────────────────────────
async function gerar() {
  const tapval = document.getElementById('inp-sit');
  if(tapval) state.sit = tapval.value;
  if (!state.sit.trim()) return;
  setState({busy:true, res:null, err:'', exOpen:{}});
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:4000,
        system: PROMPT,
        messages:[{role:"user", content:"Situação: "+state.sit}]
      })
    });
    if (!r.ok) {
      const eb = await r.text();
      let msg = "Erro "+r.status;
      try { const ej=JSON.parse(eb); msg = ej.error?.message||msg; } catch(_){}
      throw new Error(msg);
    }
    const d = await r.json();
    if (d.stop_reason==="max_tokens") throw new Error("Resposta cortada. Tente uma situação mais curta.");
    const raw = ((d.content&&d.content[0]&&d.content[0].text)||"").trim();
    if (!raw) throw new Error("Resposta vazia da API. Tente novamente.");
    // Tentativas de parse progressivas
    let parsed = null;
    const candidates = [
      raw,
      raw.replace(/^```json\s*/,"").replace(/\s*```$/,"").trim(),
      raw.replace(/```json|```/g,"").trim(),
    ];
    for (const c of candidates) {
      try { parsed = JSON.parse(c); break; } catch(_) {}
    }
    // Última tentativa: extrair o maior bloco {} da resposta
    if (!parsed) {
      const m = raw.match(/\{[\s\S]*\}/);
      if (m) { try { parsed = JSON.parse(m[0]); } catch(_) {} }
    }
    if (!parsed) {
      // Mostra os primeiros 300 chars para diagnóstico
      throw new Error("JSON inválido. Resposta recebida: " + raw.slice(0,300));
    }
    setState({res:parsed});
  } catch(e) {
    setState({err:e.message||"Erro desconhecido."});
  } finally {
    setState({busy:false});
  }
}

function copy(txt, id) {
  navigator.clipboard.writeText(txt).then(()=>{
    setState({cp:id});
    setTimeout(()=>setState({cp:null}),1500);
    setState({toast:true});
    setTimeout(()=>setState({toast:false}),2000);
  });
}

  setState(s=>({users:[...s.users,{user:nu,pass:np,role:'user'}],nu:'',np:'',amsg:{e:'',o:`Adicionado: ${nu}`}}));

  const lngCount=state.linguagensSel.length;
  lngHdr.appendChild(h('div',{style:css({fontSize:'0.62rem',color:C.MUT,fontStyle:'italic'})},lngCount===0?'Selecione até 3':lngCount===3?'Máximo atingido':`${lngCount} selecionada${lngCount>1?'s':''}`));
  card.querySelector('div:last-child').appendChild(lngHdr);
  const lngList=h('div',{style:css({display:'flex',flexDirection:'column',gap:'8px'})});
  LINGUAGENS.forEach(l=>{
    const sel=state.linguagensSel.includes(l.id);
    const disabled=!sel&&state.linguagensSel.length>=3;
    const lb=h('button',{
      className:'lng-btn',
      disabled,
      onClick:()=>{
        // Salva o texto digitado antes de re-renderizar
        const t=document.getElementById('inp-sit');
        if(t) state.sit=t.value;
        setState(s=>{
          const prev=s.linguagensSel;
          const next=prev.includes(l.id)?prev.filter(x=>x!==l.id):prev.length>=3?prev:[...prev,l.id];
          return {linguagensSel:next};
        });
      },
      style:css({display:'flex',alignItems:'center',gap:'14px',background:sel?'rgba(201,169,110,0.05)':'transparent',border:`1px solid ${sel?l.cor:C.BORD}`,borderLeft:`3px solid ${sel?l.cor:'transparent'}`,borderRadius:'0 3px 3px 0',padding:'12px 16px',cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.35:1,transition:'all 0.2s',textAlign:'left',fontFamily:C.sans})
    });
    const chk=h('div',{style:css({width:'16px',height:'16px',borderRadius:'2px',flexShrink:'0',border:`1px solid ${sel?l.cor:C.BORD}`,background:sel?l.cor+'28':'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.2s'})});
    if(sel) chk.appendChild(h('div',{style:css({width:'7px',height:'7px',borderRadius:'1px',background:l.cor})}));
    lb.appendChild(chk);
    lb.appendChild(h('span',{style:css({fontSize:'0.92rem',color:sel?C.TXT:C.MUT,fontFamily:C.serif,fontStyle:'italic',transition:'color 0.2s'})},l.opcao));
    if(sel) lb.appendChild(h('span',{style:css({marginLeft:'auto',fontSize:'0.65rem',letterSpacing:'0.12em',textTransform:'uppercase',color:l.cor,opacity:'0.85',flexShrink:'0'})},l.nome));
    lngList.appendChild(lb);
  });
  card.querySelector('div:last-child').appendChild(lngList);

  // Gerar btn
  const gerarBtn=h('button',{
    disabled:state.busy,
    onClick:gerar,
    style:css({width:'100%',marginTop:'22px',padding:'17px',background:'transparent',border:`1px solid ${C.A}`,color:C.A,fontFamily:C.sans,fontSize:'0.8rem',letterSpacing:'0.2em',textTransform:'uppercase',cursor:state.busy?'not-allowed':'pointer',borderRadius:'3px',display:'flex',alignItems:'center',justifyContent:'center',gap:'12px',opacity:state.busy?0.7:1})
  });
  if(state.busy){gerarBtn.appendChild(spin());gerarBtn.appendChild(document.createTextNode('Analisando...'))}
  else gerarBtn.appendChild(document.createTextNode('Analisar e Gerar Percepções'));
  card.appendChild(gerarBtn);
  main.appendChild(card);

  // Status
  if(state.busy) main.appendChild(h('div',{style:css({display:'flex',alignItems:'center',gap:'12px',marginBottom:'20px',padding:'14px 20px',background:C.SURF,border:`1px solid ${C.BORD}`,borderLeft:`3px solid ${C.A2}`,borderRadius:'0 3px 3px 0',fontSize:'0.85rem',color:C.A2,fontStyle:'italic'})},'Analisando a dinâmica sistêmica • • •'));
  if(state.err) main.appendChild(h('div',{style:css({padding:'20px 24px',background:'rgba(200,80,80,0.08)',border:'1px solid rgba(200,80,80,0.25)',borderRadius:'3px',color:'#e08080',fontSize:'0.9rem',lineHeight:'1.6',marginBottom:'22px'})},'⚠ '+state.err));

  // Results
  if(state.res) main.appendChild(renderResults());

  if(!state.res&&!state.err&&!state.busy){
    main.appendChild(h('div',{style:css({textAlign:'center',padding:'60px 20px',color:C.MUT})},
      h('div',{style:css({fontSize:'1.8rem',marginBottom:'14px',opacity:'0.15'})},'◇'),
      h('div',{style:css({fontFamily:C.serif,fontStyle:'italic',fontSize:'1.15rem',lineHeight:'1.8'})},'Descreva a situação acima para gerar percepções sistêmicas')
    ));
  }

  // Toast
  const toast=h('div',{style:css({position:'fixed',bottom:'22px',left:'50%',transform:`translateX(-50%) translateY(${state.toast?'0':'80px'})`,background:C.A,color:C.BG,padding:'10px 22px',borderRadius:'3px',fontSize:'0.78rem',letterSpacing:'0.12em',transition:'transform 0.3s ease',zIndex:'200',pointerEvents:'none'})},'Frase copiada');

  wrap.append(topBar,header,main,toast);
  return wrap;
}

function renderResults() {
  const res=state.res;
  const dinInfo=res.dinamica?(DINAMICAS.find(d=>d.nome===res.dinamica)||{nome:res.dinamica,desc:''}):null;
  const leiInfo=res.lei?(LEIS.find(l=>l.nome===res.lei)||{nome:res.lei,desc:''}):null;
  const feridasInfo=res.feridas?.length>0?res.feridas.map(f=>FERIDAS.find(x=>x.nome===f)).filter(Boolean):null;
  const origemInfo=res.origem?(ORIGENS.find(o=>o.nome===res.origem)||null):null;
  const exIcons=["◈","◉","◎","◇","◆"];

  const wrap=h('div',{className:'fade-up'});

  if(dinInfo) wrap.appendChild(infoBox({label:'Dinâmica Sistêmica',bg:'linear-gradient(135deg,#0d1a1f,#0a1518)',bgLabel:'#0d1a1f',bColor:C.A2,tColor:C.A2,nome:dinInfo.nome,desc:dinInfo.desc}));

  if(res.reflexao){
    const rb=h('div',{style:css({background:'linear-gradient(135deg,#1a1a2a,#141420)',border:`1px solid ${C.BORD}`,borderTop:'2px solid rgba(201,169,110,0.4)',padding:'26px 28px',marginBottom:'16px',borderRadius:'3px',position:'relative'})});
    rb.appendChild(h('div',{style:css({position:'absolute',top:'-10px',left:'22px',background:'#141420',padding:'0 10px',fontSize:'0.65rem',letterSpacing:'0.22em',textTransform:'uppercase',color:C.A})},'Leitura Sistêmica'));
    rb.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.15rem',lineHeight:'1.85',color:'rgba(232,228,220,0.78)',fontStyle:'italic'})},res.reflexao));
    wrap.appendChild(rb);
  }

  if(leiInfo) wrap.appendChild(infoBox({label:'Lei Sistêmica',bg:'linear-gradient(135deg,#0f1a12,#0c1510)',bgLabel:'#0f1a12',bColor:C.A3,tColor:C.A3,nome:leiInfo.nome,desc:leiInfo.desc}));

  if(feridasInfo&&feridasInfo.length>0){
    const f0=feridasInfo[0];
    const fb=h('div',{style:css({background:feridasInfo.length===1?f0.bg:'linear-gradient(135deg,#1a0f1a,#110b11)',border:`1px solid ${f0.cor}30`,borderTop:`2px solid ${f0.cor}`,borderRadius:'3px',padding:'24px 28px',marginBottom:'16px',position:'relative'})});
    fb.appendChild(h('div',{style:css({position:'absolute',top:'-10px',left:'22px',background:feridasInfo.length===1?f0.bgLabel:'#1a0f1a',padding:'0 10px',fontSize:'0.65rem',letterSpacing:'0.22em',textTransform:'uppercase',color:f0.cor})},'Feridas Emocionais'));
    if(feridasInfo.length===1){
      fb.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.35rem',color:C.TXT,marginBottom:'10px'})},f0.nome));
      fb.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.08rem',lineHeight:'1.8',color:'rgba(232,228,220,0.6)',fontStyle:'italic'})},f0.desc));
    } else {
      feridasInfo.forEach(f=>{
        const row=h('div',{style:css({display:'flex',gap:'16px',alignItems:'flex-start',marginBottom:'12px'})});
        const dot=h('div',{style:css({flexShrink:'0',marginTop:'6px'})},h('div',{style:css({width:'8px',height:'8px',borderRadius:'50%',background:f.cor,opacity:'0.8'})}));
        const txt=h('div');
        txt.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.2rem',color:f.cor,marginBottom:'4px'})},f.nome));
        txt.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1rem',lineHeight:'1.75',color:'rgba(232,228,220,0.55)',fontStyle:'italic'})},f.desc));
        row.append(dot,txt); fb.appendChild(row);
      });
    }
    wrap.appendChild(fb);
  }

  if(origemInfo){
    const ob=h('div',{style:css({background:origemInfo.bg,border:`1px solid ${origemInfo.cor}28`,borderTop:`2px solid ${origemInfo.cor}`,borderRadius:'3px',padding:'24px 28px',marginBottom:'16px',position:'relative'})});
    ob.appendChild(h('div',{style:css({position:'absolute',top:'-10px',left:'22px',background:origemInfo.bgLabel,padding:'0 10px',fontSize:'0.65rem',letterSpacing:'0.22em',textTransform:'uppercase',color:origemInfo.cor})},'Origens Sistêmicas do Sofrimento'));
    ob.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.35rem',color:C.TXT,marginBottom:'10px'})},origemInfo.nome));
    ob.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.05rem',lineHeight:'1.8',color:'rgba(232,228,220,0.58)',fontStyle:'italic',marginBottom:'18px'})},origemInfo.desc));
    const pills=h('div',{style:css({display:'flex',flexWrap:'wrap',gap:'8px',marginBottom:'16px'})});
    origemInfo.sintomas.forEach(s=>pills.appendChild(h('span',{style:css({fontSize:'0.72rem',letterSpacing:'0.1em',color:origemInfo.cor,opacity:'0.75',padding:'4px 11px',border:`1px solid ${origemInfo.cor}30`,borderRadius:'2px',fontFamily:C.sans})},`– ${s}`)));
    ob.appendChild(pills);
    const raizRow=h('div',{style:css({display:'flex',alignItems:'flex-start',gap:'10px',padding:'11px 15px',background:'rgba(0,0,0,0.2)',borderRadius:'2px',borderLeft:`2px solid ${origemInfo.cor}50`})});
    raizRow.appendChild(h('span',{style:css({fontSize:'0.6rem',letterSpacing:'0.18em',textTransform:'uppercase',color:origemInfo.cor,flexShrink:'0',marginTop:'2px',opacity:'0.8'})},'Raiz'));
    raizRow.appendChild(h('span',{style:css({fontFamily:C.serif,fontSize:'0.98rem',lineHeight:'1.65',color:'rgba(232,228,220,0.5)',fontStyle:'italic'})},origemInfo.raiz));
    ob.appendChild(raizRow); wrap.appendChild(ob);
  }

  // Investigação
  if(res.investigacao&&res.investigacao.length>0){
    const ib=h('div',{style:css({background:'linear-gradient(135deg,#0f0d1a,#0c0a14)',border:'1px solid rgba(184,168,216,0.22)',borderTop:'2px solid #b8a8d8',borderRadius:'3px',padding:'24px 28px',marginBottom:'16px',position:'relative'})});
    ib.appendChild(h('div',{style:css({position:'absolute',top:'-10px',left:'22px',background:'#0f0d1a',padding:'0 10px',fontSize:'0.65rem',letterSpacing:'0.22em',textTransform:'uppercase',color:'#b8a8d8'})},'Investigação para Reconhecer o que Precisa ser Visto'));
    ib.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1rem',lineHeight:'1.7',color:'rgba(184,168,216,0.5)',fontStyle:'italic',marginBottom:'22px',marginTop:'4px'})},'O que pede lugar. O que ainda não foi visto.'));
    res.investigacao.forEach((q,qi)=>{
      const row=h('div',{style:css({display:'flex',gap:'16px',alignItems:'flex-start',background:'rgba(184,168,216,0.04)',border:'1px solid rgba(184,168,216,0.18)',borderLeft:'3px solid rgba(184,168,216,0.55)',borderRadius:'0 3px 3px 0',padding:'16px 20px',marginBottom:'10px'})});
      row.appendChild(h('div',{style:css({flexShrink:'0',fontFamily:C.serif,fontSize:'1.4rem',color:'rgba(184,168,216,0.4)',lineHeight:'1',marginTop:'2px'})},'①②③④⑤'[qi]||String(qi+1)));
      const qBody=h('div',{style:css({flex:'1'})});
      const qHdr=h('div',{style:css({display:'flex',alignItems:'baseline',gap:'10px',marginBottom:'6px',flexWrap:'wrap'})});
      qHdr.appendChild(h('div',{style:css({fontFamily:C.sans,fontSize:'0.68rem',letterSpacing:'0.18em',textTransform:'uppercase',color:'#b8a8d8',opacity:'0.9'})},q.tema));
      qHdr.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'0.82rem',fontStyle:'italic',color:'rgba(184,168,216,0.55)'})},'— '+q.subtema));
      qBody.append(qHdr,h('div',{style:css({fontFamily:C.serif,fontSize:'1.12rem',fontStyle:'italic',lineHeight:'1.7',color:'rgba(232,228,220,0.88)'})},'\"'+q.pergunta+'\"'));
      row.appendChild(qBody); ib.appendChild(row);
    });
    wrap.appendChild(ib);
  }

  // Linguagens do amor
  if(state.linguagensSel.length>0){
    const sels=LINGUAGENS.filter(l=>state.linguagensSel.includes(l.id));
    const lb=h('div',{style:css({background:'linear-gradient(135deg,#12100a,#0d0c08)',border:`1px solid ${sels[0].cor}28`,borderTop:`2px solid ${sels[0].cor}`,borderRadius:'3px',padding:'24px 28px',marginBottom:'16px',position:'relative'})});
    lb.appendChild(h('div',{style:css({position:'absolute',top:'-10px',left:'22px',background:'#12100a',padding:'0 10px',fontSize:'0.65rem',letterSpacing:'0.22em',textTransform:'uppercase',color:sels[0].cor})},'Linguagens do Amor'));
    sels.forEach((l,li)=>{
      const section=h('div',{style:css({paddingTop:li>0?'22px':'0',borderTop:li>0?'1px solid rgba(255,255,255,0.05)':'none'})});
      const nm=h('div',{style:css({display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'})});
      nm.appendChild(h('div',{style:css({width:'6px',height:'6px',borderRadius:'50%',background:l.cor,flexShrink:'0'})}));
      nm.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.3rem',color:C.TXT,fontWeight:'300'})},l.nome));
      section.appendChild(nm);
      l.frases.forEach(fr=>section.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.05rem',fontStyle:'italic',color:'rgba(232,228,220,0.65)',lineHeight:'1.6',paddingLeft:'16px',marginBottom:'6px'})},`"${fr}"`)));
      const pr=h('div',{style:css({display:'flex',flexWrap:'wrap',gap:'7px',marginBottom:'12px',paddingLeft:'16px'})});
      l.raizes.forEach(r=>pr.appendChild(h('span',{style:css({fontSize:'0.7rem',letterSpacing:'0.09em',color:l.cor,opacity:'0.7',padding:'3px 10px',border:`1px solid ${l.cor}28`,borderRadius:'2px',fontFamily:C.sans})},`– ${r}`)));
      section.appendChild(pr);
      section.appendChild(h('div',{style:css({paddingLeft:'16px',marginBottom:li<sels.length-1?'0':'0'})},h('div',{style:css({display:'inline-flex',padding:'8px 14px',background:'rgba(0,0,0,0.25)',borderRadius:'2px',borderLeft:`2px solid ${l.cor}45`})},h('span',{style:css({fontFamily:C.serif,fontSize:'0.92rem',lineHeight:'1.6',color:'rgba(232,228,220,0.45)',fontStyle:'italic'})},l.frase_chave))));
      lb.appendChild(section);
    });
    wrap.appendChild(lb);
  }

  // Categorias / frases
  if(res.categorias&&res.categorias.length>0){
    const catWrap=h('div',{style:css({marginTop:'12px'})});
    res.categorias.forEach((cat,ci)=>{
      const catDiv=h('div',{style:css({marginBottom:'30px'})});
      const catHdr=h('div',{style:css({display:'flex',alignItems:'center',gap:'14px',marginBottom:'18px'})});
      catHdr.appendChild(h('div',{style:css({fontSize:'0.7rem',letterSpacing:'0.2em',textTransform:'uppercase',color:C.A2,padding:'5px 12px',border:'1px solid rgba(143,168,200,0.3)',borderRadius:'2px',whiteSpace:'nowrap'})},cat.nome));
      catHdr.appendChild(h('div',{style:css({flex:'1',height:'1px',background:C.BORD})}));
      catDiv.appendChild(catHdr);
      (cat.frases||[]).forEach((f,fi)=>{
        const id=`${ci}-${fi}`;
        const fDiv=h('div',{style:css({background:C.SURF,border:`1px solid ${C.BORD}`,borderLeft:`3px solid ${state.cp===id?'#6ec99a':C.A}`,padding:'22px 60px 22px 26px',marginBottom:'12px',borderRadius:'0 3px 3px 0',position:'relative'})});
        fDiv.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.28rem',fontWeight:'300',fontStyle:'italic',lineHeight:'1.6'})},`"${f.texto}"`));
        const meta=h('div',{style:css({display:'flex',alignItems:'center',gap:'14px',marginTop:'10px',flexWrap:'wrap'})});
        if(f.especialista) meta.appendChild(h('div',{style:css({fontSize:'0.7rem',color:'rgba(201,169,110,0.55)',fontStyle:'italic'})},`— ${f.especialista}`));
        if(f.contexto) meta.appendChild(h('div',{style:css({fontSize:'0.68rem',letterSpacing:'0.1em',color:C.MUT,marginTop:'3px'})},f.contexto));
        fDiv.appendChild(meta);
        fDiv.appendChild(h('button',{
          onClick:e=>{e.stopPropagation();copy(f.texto,id);},
          style:css({position:'absolute',right:'14px',top:'50%',transform:'translateY(-50%)',background:'transparent',border:`1px solid ${C.BORD}`,color:C.MUT,fontSize:'0.62rem',letterSpacing:'0.1em',padding:'5px 9px',borderRadius:'2px',cursor:'pointer',fontFamily:C.sans,textTransform:'uppercase'})
        },'copiar'));
        catDiv.appendChild(fDiv);
      });
      catWrap.appendChild(catDiv);
    });
    wrap.appendChild(catWrap);
  }

  // Exercícios
  if(res.exercicios&&res.exercicios.length>0){
    const exSection=h('div',{style:css({marginTop:'28px',marginBottom:'10px'})});
    const exHdr=h('div',{style:css({display:'flex',alignItems:'center',gap:'14px',marginBottom:'22px'})});
    exHdr.appendChild(h('div',{style:css({flex:'1',height:'1px',background:C.BORD})}));
    exHdr.appendChild(h('div',{style:css({fontSize:'0.65rem',letterSpacing:'0.26em',textTransform:'uppercase',color:'rgba(168,200,160,0.7)',padding:'5px 14px',border:'1px solid rgba(168,200,160,0.2)',borderRadius:'2px',whiteSpace:'nowrap'})},'Práticas & Exercícios'));
    exHdr.appendChild(h('div',{style:css({flex:'1',height:'1px',background:C.BORD})}));
    exSection.appendChild(exHdr);
    const exBox=h('div',{style:css({background:'linear-gradient(135deg,#0e1a10,#0b1510)',border:'1px solid rgba(168,200,160,0.18)',borderTop:`2px solid ${C.A3}`,borderRadius:'4px',padding:'26px 28px',position:'relative',marginBottom:'8px'})});
    exBox.appendChild(h('div',{style:css({position:'absolute',top:'-11px',left:'22px',background:'#0e1a10',padding:'0 12px',fontSize:'0.62rem',letterSpacing:'0.24em',textTransform:'uppercase',color:C.A3})},'Exercícios de Ressignificação · Inclusão · Reparação'));
    exBox.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1rem',lineHeight:'1.8',color:'rgba(168,200,160,0.55)',fontStyle:'italic',marginBottom:'22px',marginTop:'4px'})},'Para que o que ficou parado possa se mover. Para que a vida flua.'));
    res.exercicios.forEach((ex,ei)=>{
      const isSens=ex.sensorial===true;
      const exCor=isSens?'#c8a8d8':'rgba(168,200,160,1)';
      const exCorL=isSens?'rgba(200,168,216,':'rgba(168,200,160,';
      const exDiv=h('div',{style:css({marginBottom:ei<res.exercicios.length-1?'14px':'0'})});
      if(isSens){
        const sensHdr=h('div',{style:css({display:'flex',alignItems:'center',gap:'10px',margin:'18px 0 10px'})});
        sensHdr.appendChild(h('div',{style:css({flex:'1',height:'1px',background:'rgba(200,168,216,0.15)'})}));
        sensHdr.appendChild(h('div',{style:css({fontSize:'0.6rem',letterSpacing:'0.2em',textTransform:'uppercase',color:'rgba(200,168,216,0.6)',padding:'4px 12px',border:'1px solid rgba(200,168,216,0.2)',borderRadius:'2px',whiteSpace:'nowrap',flexShrink:'0'})},'✦ Exercício Sensorial · O que Cura'));
        sensHdr.appendChild(h('div',{style:css({flex:'1',height:'1px',background:'rgba(200,168,216,0.15)'})}));
        exDiv.appendChild(sensHdr);
      }
      const isOpen=!!state.exOpen[ei];
      const exBtn=h('button',{
        onClick:()=>setState(s=>({exOpen:{...s.exOpen,[ei]:!s.exOpen[ei]}})),
        style:css({width:'100%',background:isOpen?`${exCorL}0.06)`:`${exCorL}0.03)`,border:`1px solid ${exCorL}${isOpen?'0.22)':'0.12)'}`,borderLeft:`3px solid ${exCor}`,borderRadius:'0 3px 3px 0',padding:'16px 20px',cursor:'pointer',display:'flex',alignItems:'center',gap:'14px',textAlign:'left',transition:'all 0.25s',fontFamily:C.sans})
      });
      exBtn.appendChild(h('span',{style:css({fontSize:'1rem',color:exCor,opacity:'0.7',flexShrink:'0'})},isSens?'✦':exIcons[ei%exIcons.length]));
      exBtn.appendChild(h('span',{style:css({fontFamily:C.serif,fontSize:'1.18rem',color:C.TXT,fontWeight:'300',flex:'1',lineHeight:'1.3'})},ex.titulo));
      exBtn.appendChild(h('span',{style:css({fontSize:'0.75rem',color:exCor,opacity:'0.6',flexShrink:'0',display:'inline-block',transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.25s'})},'▾'));
      exDiv.appendChild(exBtn);
      if(isOpen){
        const exBody=h('div',{className:'ex-body',style:css({background:`${exCorL}0.04)`,border:`1px solid ${exCorL}0.12)`,borderTop:'none',borderLeft:`3px solid ${exCorL}0.3)`,borderRadius:'0 0 3px 0',padding:'20px 24px 22px'})});
        exBody.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.08rem',lineHeight:'1.85',color:'rgba(232,228,220,0.82)',marginBottom:'16px'})},ex.descricao));
        const int=h('div',{style:css({display:'flex',alignItems:'flex-start',gap:'10px',padding:'12px 16px',background:`${exCorL}0.06)`,borderRadius:'2px',border:`1px solid ${exCorL}0.1)`})});
        int.appendChild(h('span',{style:css({fontSize:'0.62rem',letterSpacing:'0.2em',textTransform:'uppercase',color:exCor,flexShrink:'0',marginTop:'2px'})},'Intenção'));
        int.appendChild(h('span',{style:css({fontFamily:C.serif,fontSize:'1rem',lineHeight:'1.7',color:`${exCorL}0.75)`,fontStyle:'italic'})},ex.intencao));
        exBody.appendChild(int); exDiv.appendChild(exBody);
      }
      exBox.appendChild(exDiv);
    });
    exSection.appendChild(exBox);
    wrap.appendChild(exSection);
  }

  // Músicas
  if(res.musica_nac||res.musica_int){
    const MUS_COR='#9b8fc8';
    const resolve=(field,pool)=>{if(!field)return null;return pool.find(m=>m.id===field.id)||pool[0];};
    const mNac=resolve(res.musica_nac,MUSICAS_NAC);
    const mInt=resolve(res.musica_int,MUSICAS_INT);
    const musBox=h('div',{style:css({background:'linear-gradient(135deg,#130f1e,#0e0b18)',border:'1px solid '+MUS_COR+'28',borderTop:'2px solid '+MUS_COR,borderRadius:'3px',padding:'24px 28px',marginBottom:'16px',position:'relative'})});
    musBox.appendChild(h('div',{style:css({position:'absolute',top:'-10px',left:'22px',background:'#130f1e',padding:'0 10px',fontSize:'0.65rem',letterSpacing:'0.22em',textTransform:'uppercase',color:MUS_COR})},'Músicas Sistêmicas'));
    const musRow=h('div',{style:css({display:'flex',gap:'24px',flexWrap:'wrap',marginTop:'4px'})});
    function musicCard(m,motivo,label){
      const card=h('div',{style:css({flex:'1',minWidth:'240px'})});
      card.appendChild(h('div',{style:css({fontSize:'0.6rem',letterSpacing:'0.2em',textTransform:'uppercase',color:MUS_COR,opacity:'0.6',marginBottom:'8px'})},label));
      card.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'1.15rem',color:C.TXT,fontWeight:'300',marginBottom:'2px'})},m.titulo));
      card.appendChild(h('div',{style:css({fontSize:'0.75rem',letterSpacing:'0.08em',color:MUS_COR,opacity:'0.75',marginBottom:'10px'})},m.artista));
      if(motivo) card.appendChild(h('div',{style:css({fontFamily:C.serif,fontSize:'0.88rem',lineHeight:'1.6',color:'rgba(232,228,220,0.45)',fontStyle:'italic',marginBottom:'12px'})},motivo));
      const lnk=h('a',{href:`https://www.youtube.com/watch?v=${m.youtube_id}`,target:'_blank',rel:'noopener noreferrer',style:css({textDecoration:'none',display:'inline-flex',alignItems:'center',gap:'8px',padding:'9px 16px',background:'rgba(155,143,200,0.07)',border:'1px solid '+MUS_COR+'40',borderRadius:'3px',cursor:'pointer'})});
      const playBtn=h('div',{style:css({width:'28px',height:'28px',borderRadius:'50%',background:'rgba(155,143,200,0.12)',border:'1px solid '+MUS_COR,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0'})});
      playBtn.innerHTML=`<svg width="10" height="10" viewBox="0 0 24 24" fill="${MUS_COR}"><polygon points="6,3 20,12 6,21"/></svg>`;
      lnk.append(playBtn,h('span',{style:css({fontFamily:C.sans,fontSize:'0.62rem',letterSpacing:'0.16em',textTransform:'uppercase',color:MUS_COR,opacity:'0.8'})},'Ouvir no YouTube'));
      card.appendChild(lnk); return card;
    }
    if(mNac) musRow.appendChild(musicCard(mNac,res.musica_nac?.motivo,'Nacional'));
    if(mNac&&mInt) musRow.appendChild(h('div',{style:css({width:'1px',background:MUS_COR+'20',alignSelf:'stretch',flexShrink:'0'})}));
    if(mInt) musRow.appendChild(musicCard(mInt,res.musica_int?.motivo,'Internacional'));
    musBox.appendChild(musRow); wrap.appendChild(musBox);
  }

  return wrap;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render() {
  const root=document.getElementById('root');
  root.innerHTML='';
  if(state.screen==='login') root.appendChild(renderLogin());
  else if(state.screen==='admin') root.appendChild(renderAdmin());
  else root.appendChild(renderApp());
}

render();
</script>
</body>
</html>
