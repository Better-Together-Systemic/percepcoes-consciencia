services:
  app:
    build: .
    ports:
      - '3333:3333'
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_PATH: /data/app.db
      WEB_DIST_PATH: /app/apps/web/dist
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  app-data:
